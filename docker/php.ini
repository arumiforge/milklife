; Pengaturan PHP MilkLife di container (K182).
; Menggantikan isian php.ini Laragon di panduan pemasangan lama.

; Batas unggah: 10 MB untuk berkas unduhan yang diunggah admin (juknis)
; dan impor cadangan lewat panel.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M

date.timezone = Asia/Jakarta
expose_php = Off
display_errors = Off
log_errors = On

; OPcache. Kode di dalam image tidak berubah selama container berjalan,
; jadi PHP tidak perlu memeriksa tanggal berkas. Setiap pembaruan
; membangun image baru dan menyalakan ulang container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600
