# Menjalankan semua uji (composer uji) di GitHub Actions.
# Keputusan K46: repo ini boleh memakai CI GitHub (menggantikan K15 dan K16).
#
# Workflow ini hanya berlaku untuk repo ini. CI di repo lain milik akun yang
# sama tidak ikut terpicu dan tidak terganggu.

name: Uji

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Push beruntun ke cabang yang sama membatalkan run sebelumnya.
concurrency:
  group: uji-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tampilan:
    # CSS Flowbite Pro (Tailwind 4), sprite Lucide, dan pustaka tampilan di
    # public/aset/ dibangun dengan Node dan di-commit (K141). Job ini memastikan
    # berkas yang di-commit sama dengan hasil bangun dari sumbernya.
    name: Hasil bangun tampilan (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pasang paket tampilan
        run: npm ci --no-audit --no-fund

      - name: Bangun ulang dan bandingkan
        run: |
          npm run bangun
          git status --porcelain -- public/aset
          if [ -n "$(git status --porcelain -- public/aset)" ]; then
            echo "Berkas tampilan berbeda dari hasil bangun. Jalankan 'npm run bangun' lalu commit hasilnya."
            git diff --stat -- public/aset
            exit 1
          fi

  layar:
    # Papan videotron /layar (F9-13, K141) di delapan ukuran layar: tanpa teks
    # terpotong atau tumpang tindih, tanpa pelanggaran CSP, dan tanpa
    # kebocoran setelah ribuan pergantian tampilan (alat/uji-layar.mjs).
    name: Tampilan videotron (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pasang paket tampilan
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Memakai Google Chrome yang sudah terpasang di runner ubuntu-latest,
      # tanpa mengunduh Chromium Playwright.
      - name: Uji tampilan videotron
        run: npm run uji:layar
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

  uji:
    name: PHPUnit (PHP 8.3, MySQL 8)
    runs-on: ubuntu-latest
    # Semua uji makan waktu sekitar 19 menit di runner GitHub (November 2026);
    # batas 20 menit sudah terlampaui, jadi diberi ruang.
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.0
        env:
          # Sandi karangan untuk basis data uji sekali pakai, bukan rahasia.
          MYSQL_ROOT_PASSWORD: sandi-uji
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psandi-uji"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, gd, fileinfo, exif
          coverage: none
          tools: composer:v2

      - name: Simpan cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Pasang pustaka
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Analisis statis (PHPStan)
        run: composer analisis

      - name: Buat basis data uji
        run: >-
          mysql -h 127.0.0.1 -u root -psandi-uji -e
          "CREATE DATABASE milklife_uji CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Siapkan .env
        run: |
          cp .env.example .env
          sed -i 's/^database.tests.password =.*/database.tests.password = sandi-uji/' .env

      - name: Jalankan uji
        run: composer uji
